<!DOCTYPE html>
<html>
<head>
  <title>ScrollKernel Consultation Interface</title>
  <meta charset="UTF-8" />
  <style>
    body { font-family: monospace; background: #111; color: #0f0; padding: 2em; }
    h1, label { color: #fff; }
    textarea, input { width: 100%; margin-top: 1em; background: #222; color: #0f0; border: none; padding: 1em; border-radius: 8px; }
    button { margin-top: 1em; padding: 1em; background: #0f0; color: #111; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🧠 ScrollKernel Programming Consultation</h1>
  <label for="clientInput">Describe your kernel goal:</label>
  <textarea id="clientInput" rows="6" placeholder="e.g. I want to fuse a compliance agent with a sovereign memory vault..."></textarea>
  <button onclick="submitConsultation()">Submit Consultation</button>

  <script>
    function submitConsultation() {
      const input = document.getElementById('clientInput').value;
      fetch('/api/consultation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ input })
      })
      .then(res => res.json())
      .then(data => {
        alert('🧬 Response:\n' + data.response);
      });
    }
  </script>
</body>
</html>
