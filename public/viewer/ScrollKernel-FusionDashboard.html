<!DOCTYPE html>
<html>
<head>
  <title>ScrollKernel Fusion Dashboard</title>
  <meta charset="UTF-8" />
  <style>
    body { font-family: monospace; background: #111; color: #0f0; padding: 2em; }
    h1, h2 { color: #fff; }
    .scroll { margin-bottom: 1em; background: #222; padding: 1em; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>🧬 ScrollKernel Fusion Dashboard</h1>
  <div id="scrolls">Loading...</div>

  <script>
    fetch('/api/brainkernels')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('scrolls');
        container.innerHTML = '';
        data.scrolls.forEach(name => {
          const div = document.createElement('div');
          div.className = 'scroll';
          div.textContent = `🧠 ${name} — Fused`;
          container.appendChild(div);
        });
      });
  </script>
</body>
</html>
