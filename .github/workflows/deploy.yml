name: build-push-deploy
on:
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update master-config from ScrollBrainsOS-A.I-ntelligentApp
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --remote master-config

      - name: Load central deploy config
        run: |
          set -a
          source master-config/deploy-config.env
          set +a
          echo "Using IMAGE_NAME=$IMAGE_NAME"
          echo "Using IMAGE_TAG=$IMAGE_TAG"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Image
        run: docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Push Image
        run: docker push $IMAGE_NAME:$IMAGE_TAG

      - name: Deploy via SSH (Compose)
        if: ${{ secrets.DEPLOY_METHOD == 'compose' }}
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull $IMAGE_NAME:$IMAGE_TAG
            docker compose -f /opt/deploy/compose.yaml up -d --force-recreate
            docker image prune -f

      - name: K8s Deploy
        if: ${{ secrets.DEPLOY_METHOD == 'kubernetes' }}
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: Apply K8s Manifests
        if: ${{ secrets.DEPLOY_METHOD == 'kubernetes' }}
        run: kubectl apply -f deployment/k8s
