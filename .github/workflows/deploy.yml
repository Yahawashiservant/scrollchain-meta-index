name: build-push-deploy
on:
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build Capital Intelligence Image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .
      - name: Push Image to GHCR
        run: docker push $IMAGE_NAME:${{ github.sha }}
      - name: Deploy via SSH (Compose)
        if: ${{ secrets.DEPLOY_METHOD == 'compose' }}
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull $IMAGE_NAME:${{ github.sha }}
            docker compose -f /opt/deploy/compose.yaml up -d --force-recreate
            docker image prune -f
      - name: K8s Deploy
        if: ${{ secrets.DEPLOY_METHOD == 'kubernetes' }}
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'
      - name: Apply K8s Manifests
        if: ${{ secrets.DEPLOY_METHOD == 'kubernetes' }}
        run: kubectl apply -f deployment/k8s
      - name: Log Deployment Metadata
        run: |
          mkdir -p ./logs
          echo "Phase: Quantum Capital Infrastructure 1–72" >> ./logs/deploy-log.txt
          echo "Commit: $GITHUB_SHA" >> ./logs/deploy-log.txt
          echo "Deployed at $(date -u)" >> ./logs/deploy-log.txt
