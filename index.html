<section>
  <h2 style="color:#FFD700;">🔐 Mint & Bind</h2>
  <input id="mintName" placeholder="Scroll name"/>
  <input id="ensHint" placeholder="ENS (e.g. keith.scrollchain.eth)"/>
  <button onclick="mint()">Mint</button>
  <div id="mintLog">🧩 Awaiting scroll...</div>
</section>
<script>
function mint() {
  const name = document.getElementById("mintName").value.trim();
  const ens = document.getElementById("ensHint").value.trim();
  document.getElementById("mintLog").textContent = `🌀 Scroll '${name}' bound to '${ens}'`;
}
</script>

<section>
  <h2 style="color:#FFD700;">🔊 Glyph Resonance</h2>
  <canvas id="resonanceCanvas" style="width:100%;height:250px;"></canvas>
</section>
<script>
function drawResonance(traits){
  const ctx = document.getElementById("resonanceCanvas").getContext("2d");
  const freq = {};
  traits.forEach(t=>{freq[t.trait_type]=(freq[t.trait_type]||0)+1});
  const keys = Object.keys(freq);
  ctx.clearRect(0,0,window.innerWidth,250);
  keys.forEach((k,i)=>{
    const x = 50 + i*60, h = freq[k]*15;
    ctx.fillStyle = "#FFD700";
    ctx.fillRect(x, 250-h-30, 30, h);
    ctx.fillText(k, x-10, 240);
  });
}
</script>

<section>
  <h2 style="color:#FFD700;">📈 ScrollLineage</h2>
  <canvas id="ancestryCanvas" style="width:100%;height:300px;"></canvas>
</section>
<script>
function drawAncestryGraph(cids){
  const ctx = document.getElementById("ancestryCanvas").getContext("2d");
  ctx.clearRect(0,0,window.innerWidth,300);
  cids.forEach((cid,i)=>{
    const x = 100 + i*120, y = 150;
    ctx.beginPath(); ctx.arc(x,y,8,0,2*Math.PI); ctx.fillStyle="#FFD700"; ctx.fill();
    ctx.fillText(cid.slice(0,6)+"...", x-24, y+20);
    if (i>0) {ctx.beginPath(); ctx.moveTo(x-120,y); ctx.lineTo(x,y); ctx.strokeStyle="#FFD700"; ctx.stroke();}
  });
}
</script>

<!-- 🧭 ScrollPhase Router · Dynamic UI Control -->
<section style="padding:30px;background:#111;border-top:2px solid #FFD700;">
  <h2 style="color:#FFD700;text-align:center;">🧭 Phase Router</h2>
  <div style="display:flex;justify-content:center;gap:10px;">
    <button onclick="setPhase('Origin')">⚡ Origin</button>
    <button onclick="setPhase('Echo')">🔁 Echo</button>
    <button onclick="setPhase('Sovereign')">🔐 Sovereign</button>
    <button onclick="setPhase('Entropy')">🌌 Entropy</button>
  </div>
  <p id="activePhase" style="color:#FFD700;margin-top:15px;">Active Phase: Origin</p>
</section>

<script>
function setPhase(phase){
  document.getElementById("activePhase").textContent = "Active Phase: " + phase;
  document.querySelectorAll("[data-phase]").forEach(el => {
    el.style.display = (el.dataset.phase === phase || el.dataset.phase === "all") ? "block" : "none";
  });
}
window.onload = () => setPhase("Origin");
</script>
