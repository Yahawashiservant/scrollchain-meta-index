<section data-phase="Origin">
  <h2 style="color:#FFD700;">🔐 Mint & Bind</h2>

<script>

<section data-phase="Origin">
  <h2 style="color:#FFD700;">🔊 Glyph Resonance</h2>
  <canvas id="resonanceCanvas" style="width:100%;height:250px;"></canvas>
</section>
<script>
function drawResonance(traits){
  const ctx = document.getElementById("resonanceCanvas").getContext("2d");
  const freq = {};
  traits.forEach(t=>{freq[t.trait_type]=(freq[t.trait_type]||0)+1});
  const keys = Object.keys(freq);
  ctx.clearRect(0,0,window.innerWidth,250);
  keys.forEach((k,i)=>{
    const x = 50 + i*60, h = freq[k]*15;
    ctx.fillStyle = "#FFD700";
    ctx.fillRect(x, 250-h-30, 30, h);
    ctx.fillText(k, x-10, 240);
  });
}
</script>

<section data-phase="Origin">
  <h2 style="color:#FFD700;">📈 ScrollLineage</h2>
  <canvas id="ancestryCanvas" style="width:100%;height:300px;"></canvas>
</section>
<script>
function drawAncestryGraph(cids){
  const ctx = document.getElementById("ancestryCanvas").getContext("2d");
  ctx.clearRect(0,0,window.innerWidth,300);
  cids.forEach((cid,i)=>{
    const x = 100 + i*120, y = 150;
    ctx.beginPath(); ctx.arc(x,y,8,0,2*Math.PI); ctx.fillStyle="#FFD700"; ctx.fill();
    ctx.fillText(cid.slice(0,6)+"...", x-24, y+20);
    if (i>0) {ctx.beginPath(); ctx.moveTo(x-120,y); ctx.lineTo(x,y); ctx.strokeStyle="#FFD700"; ctx.stroke();}
  });
}
</script>

<!-- 🧭 ScrollPhase Router · Dynamic UI Control -->
<section style="padding:30px;background:#111;border-top:2px solid #FFD700;">
  <h2 style="color:#FFD700;text-align:center;">🧭 Phase Router</h2>
  <div style="display:flex;justify-content:center;gap:10px;">
    <button onclick="setPhase('Origin')">⚡ Origin</button>
    <button onclick="setPhase('Echo')">🔁 Echo</button>
    <button onclick="setPhase('Sovereign')">🔐 Sovereign</button>
    <button onclick="setPhase('Entropy')">🌌 Entropy</button>
  </div>
  <p id="activePhase" style="color:#FFD700;margin-top:15px;">Active Phase: Origin</p>
</section>

<script>
function setPhase(phase){
  document.getElementById("activePhase").textContent = "Active Phase: " + phase;
  document.querySelectorAll("[data-phase]").forEach(el => {
    el.style.display = (el.dataset.phase === phase || el.dataset.phase === "all") ? "block" : "none";
  });
}
window.onload = () => setPhase("Origin");
</script>

<!-- 🧬 CID-Phase Viewer · Prophecy Trait Filter -->
<section data-phase="Echo" style="padding:30px;background:#0a0a0a;border-top:2px solid #FFD700;">
  <h2 style="color:#FFD700;text-align:center;">🧬 CID Phase Viewer · Trait by Era</h2>
  <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:15px;">
    <input id="eraCID" placeholder="Enter CID"/>
    <select id="prophecyTier">
      <option value="All">All Tiers</option>
      <option value="Genesis">Genesis</option>
      <option value="Echo">Echo</option>
      <option value="Entropy">Entropy</option>
      <option value="Sovereign">Sovereign</option>
    </select>
    <button onclick="loadCIDPhase()">🔍 Load</button>
  </div>
  <div id="cidPhaseOutput" style="color:#FFD700;margin-top:20px;text-align:center;"></div>
</section>

<script>
function loadCIDPhase(){
  const cid = document.getElementById("eraCID").value.trim();
  const tier = document.getElementById("prophecyTier").value;
  const output = document.getElementById("cidPhaseOutput");
  output.innerHTML = "⏳ Loading CID traits...";
  fetch("https://dweb.link/ipfs/" + cid)
    .then(res => res.json())
    .then(data => {
      const traits = data.attributes || [];
      output.innerHTML = `<strong>🔗 CID:</strong> ${cid}<br/><br/>`;
      traits.forEach(t => {
        if (tier === "All" || (t.trait_type && t.trait_type.includes(tier))) {
          output.innerHTML += `— <em>${t.trait_type}</em>: ${t.value}<br/>`;
        }
      });
    })
    .catch(() => {
      output.innerHTML = `⚠️ Error retrieving CID ${cid}`;
    });
}
</script>

<!-- 🧾 ScrollPoster Archive · Visual Mint Grid -->
<section data-phase="Sovereign" style="padding:30px;background:#101010;border-top:2px solid #FFD700;">
  <h2 style="color:#FFD700;text-align:center;">🧾 ScrollPoster Archive · Sovereign Scrolls</h2>
  <div id="posterGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;padding:20px;"></div>
</section>

<script>
const scrollArchive = [];

function addScrollPoster(name, ens, traits=[]){
  const poster = {
    name,
    ens,
    traits,
    timestamp: new Date().toISOString()
  };
  scrollArchive.push(poster);
  renderPosterGrid();
}

function renderPosterGrid(){
  const grid = document.getElementById("posterGrid");
  grid.innerHTML = "";
  scrollArchive.forEach(p => {
    const div = document.createElement("div");
    div.style.border = "1px solid #FFD700";
    div.style.padding = "10px";
    div.style.borderRadius = "8px";
    div.innerHTML = `
      <strong>📜 ${p.name}</strong><br/>
      ENS: <em>${p.ens}</em><br/>
      Traits: ${p.traits.length}<br/>
      🕰️ ${new Date(p.timestamp).toLocaleString()}
    `;
    grid.appendChild(div);
  });
}

// Example poster injection
addScrollPoster("Genesis Flame", "keith.scrollchain.eth", ["Phase:Origin", "Element:Fire"]);
addScrollPoster("Echo Shard", "mirror.scrollchain.eth", ["Phase:Echo", "Resonance:High"]);
</script>

<!-- 📖 ScrollCast Dashboard · Story Editor Grid -->
<section data-phase="Echo" style="padding:30px;background:#121212;border-top:2px solid #FFD700;">
  <h2 style="color:#FFD700;text-align:center;">📖 ScrollCast · Sovereign Lore Grid</h2>

  <div style="display:flex;justify-content:center;gap:10px;margin-bottom:15px;">
    <select id="storyFilter">
      <option value="all">All Scrolls</option>
      <option value="Origin">Origin</option>
      <option value="Echo">Echo</option>
      <option value="Entropy">Entropy</option>
      <option value="Sovereign">Sovereign</option>
    </select>
    <button onclick="renderStoryGrid()">🔍 Filter</button>
  </div>

  <div id="storyGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;"></div>
</section>

<script>
const scrollLore = [];

function addScrollLore(name, ens, traits=[], story=""){
  scrollLore.push({ name, ens, traits, story, timestamp: new Date().toISOString() });
  renderStoryGrid();
}

function renderStoryGrid(){
  const phase = document.getElementById("storyFilter").value;
  const grid = document.getElementById("storyGrid");
  grid.innerHTML = "";
  scrollLore.forEach((s, i) => {
    const match = (phase === "all") || s.traits.some(t => t.includes(phase));
    if (!match) return;
    const div = document.createElement("div");
    div.style.border = "1px solid #FFD700";
    div.style.padding = "10px";
    div.style.borderRadius = "8px";
    div.style.background = "#1a1a1a";
    div.innerHTML = `
      <strong>📜 ${s.name}</strong><br/>
      ENS: <em>${s.ens}</em><br/>
      Traits: ${s.traits.length}<br/>
      🕰️ ${new Date(s.timestamp).toLocaleString()}<br/><br/>
      <textarea onchange="scrollLore[${i}].story = this.value" placeholder="Write scroll story..." style="width:100%;height:100px;background:#000;color:#FFD700;border:1px solid #FFD700;padding:5px;border-radius:6px;">${s.story}</textarea>
    `;
    grid.appendChild(div);
  });
}

// 🧪 Example lore entries
addScrollLore("Genesis Flame", "keith.scrollchain.eth", ["Phase:Origin", "Element:Fire"], "Born of ignition and sovereign intent.");
addScrollLore("Echo Shard", "mirror.scrollchain.eth", ["Phase:Echo", "Resonance:High"], "Memory splits like a crystal — reflecting generations.");
</script>

<!-- 🗳️ DAO Lore Thread · Scroll Story Voting Panel -->
<section data-phase="Sovereign" style="padding:30px;background:#131313;border-top:2px solid #FFD700;">
  <h2 style="color:#FFD700;text-align:center;">🗳️ Party DAO · Lore Thread Voting</h2>
  <div id="loreVotePanel" style="display:flex;flex-direction:column;gap:15px;padding:10px;"></div>
</section>

<script>
function renderLoreVotes(){
  const panel = document.getElementById("loreVotePanel");
  panel.innerHTML = "";
  scrollLore.forEach((s, i) => {
    const div = document.createElement("div");
    div.style.border = "1px solid #FFD700";
    div.style.padding = "10px";
    div.style.borderRadius = "8px";
    div.style.background = "#1a1a1a";

    const voteLog = document.createElement("div");
    voteLog.id = `voteLog_${i}`;
    voteLog.textContent = s.votes ? `Votes: ${s.votes}` : "Votes: 0";

    const voteBtn = document.createElement("button");
    voteBtn.textContent = "🗳️ Vote for this story";
    voteBtn.style.background = "#FFD700";
    voteBtn.style.color = "#000";
    voteBtn.style.padding = "5px";
    voteBtn.style.border = "none";
    voteBtn.style.borderRadius = "6px";
    voteBtn.onclick = () => {
      s.votes = (s.votes || 0) + 1;
      voteLog.textContent = `Votes: ${s.votes}`;
    };

    div.innerHTML = `
      <strong>${s.name}</strong><br/>
      <em>${s.story || "No story yet."}</em><br/>
      Phase Match: ${s.traits.find(t => t.includes("Phase")) || "—"}
    `;
    div.appendChild(voteBtn);
    div.appendChild(voteLog);
    panel.appendChild(div);
  });
}
window.onload = renderLoreVotes;
</script>
