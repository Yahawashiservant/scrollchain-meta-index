<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🧭 ScrollChain Sovereign Dashboard</title>
  <style>
    body {
      background: #0e0e0e;
      color: #00ffcc;
      font-family: 'Courier New', monospace;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      color: #00ffff;
    }
    .viewer {
      margin: 1.5rem 0;
    }
    .viewer a {
      color: #00ffcc;
      font-size: 1.2rem;
      text-decoration: none;
    }
    .viewer a:hover {
      text-decoration: underline;
    }
    .glyph {
      font-size: 1.5rem;
      margin-right: 0.5rem;
    }
    .desc {
      font-size: 0.9rem;
      color: #88ffee;
    }
  </style>
</head>
<body>
  <h1>🧭 ScrollChain Sovereign Publishing Dashboard</h1>
  <div id="dashboard"></div>

  <script>
    fetch('ScrollChain-ViewerManifest.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('dashboard');
        for (const [file, meta] of Object.entries(data)) {
          const div = document.createElement('div');
          div.className = 'viewer';
          div.innerHTML = `
            <div>
              <span class="glyph">${meta.glyph}</span>
              <a href="${meta.gateway}" target="_blank">${meta.title}</a>
            </div>
            <div class="desc">${meta.description}</div>
          `;
          container.appendChild(div);
        }
      });
  </script>
</body>
</html>
